name: Build NFile 汉化版

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 汉化补丁
        run: |
          git apply --check starry/patch/zn-ch/nfile-zh.patch
          git apply starry/patch/zn-ch/nfile-zh.patch
          echo "汉化补丁已应用"

      - name: Read version
        id: v
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME=$(echo "$V" | cut -d '+' -f 1)
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "versionName=$NAME, buildNumber=$((43000 + ${{ github.run_number }}))"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch flutter_avif_android duplicate class
        run: |
          FILE=$(find $HOME/.pub-cache -name "FlutterAvifPlugin.java" 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            echo "// Cleared to resolve redeclaration conflict" > "$FILE"
            echo "Patched: $FILE"
          fi

      - name: Patch on_audio_query double reply (启动闪退修复)
        run: python3 tools/patch_oaq.py

      - name: Configure keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks 2>/dev/null || \
              { echo "::error::KEYSTORE 不是有效的 base64"; exit 1; }
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "已配置自定义签名"
          else
            echo "::warning::未配置 keystore secrets，使用 debug 签名（可安装，但与正式签名不兼容）"
          fi

      - name: Build APK (arm64-v8a)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-number=$((43000 + ${{ github.run_number }})) \
            --obfuscate --split-debug-info=build/symbols \
            --no-tree-shake-icons
          ls -lh build/app/outputs/flutter-apk/

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          keytool -printcert -jarfile "$APK" | grep -E "Owner:|SHA256:" | head -4

      - name: Rename
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk "NFile-v${{ steps.v.outputs.name }}-b${{ github.run_number }}-arm64-v8a.apk"
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFile-v${{ steps.v.outputs.name }}-b${{ github.run_number }}-arm64-v8a
          path: |
            build/app/outputs/flutter-apk/NFile-v${{ steps.v.outputs.name }}-b${{ github.run_number }}-arm64-v8a.apk
            build/app/outputs/mapping/release/mapping.txt
            build/symbols/**

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}-b${{ github.run_number }}
          name: v${{ steps.v.outputs.name }} · build ${{ github.run_number }}
          body: |
            NFile 汉化版，基于上游 v${{ steps.v.outputs.name }}
            - 包名 `com.rubex.nfile.starry`，可与官方版共存
            - 仅 arm64-v8a
            - versionCode ${{ github.run_number }}+43000
            - build ${{ github.run_number }} @ ${{ github.sha }}
          files: build/app/outputs/flutter-apk/NFile-v${{ steps.v.outputs.name }}-b${{ github.run_number }}-arm64-v8a.apk
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
